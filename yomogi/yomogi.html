<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/preview/yomogi/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="よもぎ蒸し" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>セルフよもぎ蒸し</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      touch-action: pan-y pinch-zoom;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      /* position: fixed;  ← A: 固定配置はやめる */
    }

    .slider-container {
      /* A: fixed → absolute + inset:0、高さは 100dvh */
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100dvh; /* iOS回転時のvhバグ対策 */
      overflow: hidden;
    }

    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.24s ease; /* 少し短めにして負荷軽減 */
      /* will-change: transform; ← A: 常時は外す */
    }

    .slides.dragging {
      transition: none;
    }

    .slide {
      flex: 0 0 100%; /* A: 100vw依存を避ける */
      height: 100%;
      contain: content; /* 合成コスト低減 */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }

    .dot.active {
      background: rgba(0, 0, 0, 0.8);
      transform: scale(1.4);
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.95);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
    }

    .arrow.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .arrow:active {
      transform: translateY(-50%) scale(0.95);
    }

    .arrow.prev {
      left: 15px;
    }

    .arrow.next {
      right: 15px;
    }

    .counter {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      z-index: 100;
    }

    @media (max-height: 768px) {
      .dots {
        bottom: 15px;
        gap: 6px;
        padding: 8px 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
      }

      .arrow {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .arrow.prev {
        left: 10px;
      }

      .arrow.next {
        right: 10px;
      }

      .counter {
        top: 15px;
        right: 15px;
        font-size: 13px;
        padding: 6px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="slider-container" id="sliderContainer">
    <div class="slides" id="slides">
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ1.png" alt="ページ1" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ2.png" alt="ページ2" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ3.png" alt="ページ3" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ4.png" alt="ページ4" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ5.png" alt="ページ5" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ6.png" alt="ページ6" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ7.png" alt="ページ7" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ8.png" alt="ページ8" /></div>
      <div class="slide"><img src="/preview/yomogiphoto/よもぎ9.png" alt="ページ9" /></div>
    </div>

    <button class="arrow prev" id="prevBtn" aria-label="前のページ">‹</button>
    <button class="arrow next" id="nextBtn" aria-label="次のページ">›</button>

    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">1 / 9</div>
  </div>

  <script>
    // ====== B: JS改善（pxベースtransform、回転時の再計算、大ジャンプは無アニメ、will-changeはドラッグ時のみ、近傍ロード） ======
    let currentSlide = 0;
    const container = document.getElementById('sliderContainer');
    const slidesEl = document.getElementById('slides');
    const totalSlides = document.querySelectorAll('.slide').length;
    const dotsContainer = document.getElementById('dots');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('counter');

    let viewportWidth = container.clientWidth;

    // 画像の遅延ロード：初回にsrc→data-srcへ退避（現行のsrcはJSで読み直す）
    const imgs = Array.from(document.querySelectorAll('.slide img'));
    imgs.forEach((img, idx) => {
      if (!img.dataset.src) img.dataset.src = img.getAttribute('src');
      img.removeAttribute('src');
      img.setAttribute('loading', 'lazy');
      img.setAttribute('decoding', 'async');
      img.setAttribute('fetchpriority', idx === 0 ? 'high' : 'low');
    });

    function ensureImage(index) {
      if (index < 0 || index >= totalSlides) return;
      const img = imgs[index];
      if (!img.getAttribute('src')) {
        const src = img.dataset.src;
        const temp = new Image();
        temp.src = src;
        (temp.decode ? temp.decode() : Promise.resolve()).finally(() => {
          img.setAttribute('src', src);
        });
      }
    }

    function releaseImage(index) {
      if (index < 0 || index >= totalSlides) return;
      const img = imgs[index];
      const keep = Math.abs(index - currentSlide) <= 2; // 近傍±2は保持
      if (!keep && img.getAttribute('src')) {
        img.removeAttribute('src');
      }
    }

    function updateCounterAndButtons() {
      prevBtn.classList.toggle('visible', currentSlide > 0);
      nextBtn.classList.toggle('visible', currentSlide < totalSlides - 1);
      counter.textContent = `${currentSlide + 1} / ${totalSlides}`;

      // 近傍を確実にロード、遠方は解放
      [currentSlide - 1, currentSlide, currentSlide + 1].forEach(ensureImage);
      for (let i = 0; i < totalSlides; i++) {
        if (Math.abs(i - currentSlide) > 2) releaseImage(i);
      }
    }

    function setTransform(noAnim = false) {
      if (noAnim) slidesEl.style.transition = 'none';
      const x = -currentSlide * viewportWidth;
      slidesEl.style.transform = `translate3d(${x}px,0,0)`;
      if (noAnim) {
        requestAnimationFrame(() => {
          slidesEl.style.transition = '';
        });
      }
    }

    function goToSlide(index, animated = true) {
      const clamped = Math.max(0, Math.min(totalSlides - 1, index));
      const distance = Math.abs(clamped - currentSlide);
      currentSlide = clamped;

      // 大ジャンプ（>1）は無アニメで瞬間移動
      const noAnim = !animated || distance > 1;
      setTransform(noAnim);
      updateCounterAndButtons();

      // ドットactive更新
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
      });
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
    }
    function prevSlide() {
      if (currentSlide > 0) goToSlide(currentSlide - 1);
    }

    // ドット生成
    dotsContainer.innerHTML = '';
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.type = 'button';
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        goToSlide(i); // 大ジャンプ時は自動的に無アニメ
      });
      dot.setAttribute('aria-label', `ページ${i + 1}へ`);
      dotsContainer.appendChild(dot);
    }

    // タッチ（ドラッグ中のみ will-change を付与）
    let touchStartX = 0;
    let isDragging = false;

    container.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      isDragging = true;
      slidesEl.classList.add('dragging');
      slidesEl.style.willChange = 'transform';
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const dx = e.touches[0].clientX - touchStartX;
      slidesEl.style.transform = `translate3d(${-currentSlide * viewportWidth + dx}px,0,0)`;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      if (!isDragging) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const threshold = Math.min(80, viewportWidth * 0.15);
      if (dx < -threshold) nextSlide();
      else if (dx > threshold) prevSlide();
      else setTransform(); // 戻す（アニメあり）
      isDragging = false;
      slidesEl.classList.remove('dragging');
      slidesEl.style.willChange = '';
    });

    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });

    // 回転/リサイズ対策：一時的にアニメ無効＆幅再取得
    let resizeRaf = null;
    function onResize() {
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => {
        viewportWidth = container.clientWidth;
        setTransform(true); // noAnim
      });
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    function init() {
      viewportWidth = container.clientWidth;
      goToSlide(0, false); // 0へ瞬間表示
      ensureImage(1); // 先読み
    }
    init();

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/preview/service-worker.js')
          .then(() => console.log('SW registered'))
          .catch(err => console.error('SW error:', err));
      });
    }
  </script>
</body>

</html>
