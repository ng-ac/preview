<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/preview/yomogi/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="よもぎ蒸し">
    <title>セルフよもぎ蒸し</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
            -webkit-user-select: none;
            user-select: none;
        }

        .slider-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .slides.no-transition {
            transition: none;
        }

        .slide {
            flex-shrink: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .dots {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.4);
        }

        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .arrow.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .arrow:active {
            transform: translateY(-50%) scale(0.95);
        }

        .arrow.prev {
            left: 15px;
        }

        .arrow.next {
            right: 15px;
        }

        .counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            z-index: 100;
        }

        @media (max-height: 768px) {
            .dots {
                bottom: 15px;
                gap: 6px;
                padding: 8px 12px;
            }

            .dot {
                width: 7px;
                height: 7px;
            }

            .arrow {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .counter {
                top: 15px;
                right: 15px;
                font-size: 13px;
                padding: 6px 12px;
            }
        }
    </style>
</head>


<body>
    <div class="slider-container" id="sliderContainer">
        <div class="slides" id="slides">
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ1.png" alt="ページ1"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ2.png" alt="ページ2"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ3.png" alt="ページ3"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ4.png" alt="ページ4"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ5.png" alt="ページ5"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ6.png" alt="ページ6"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ7.png" alt="ページ7"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ8.png" alt="ページ8"></div>
            <div class="slide"><img src="/preview/yomogiphoto/よもぎ9.png" alt="ページ9"></div>
        </div>

        <button class="arrow prev" id="prevBtn" aria-label="前のページ">‹</button>
        <button class="arrow next" id="nextBtn" aria-label="次のページ">›</button>

        <div class="dots" id="dots"></div>
        <div class="counter" id="counter">1 / 9</div>
    </div>

    <script>
         <script>
        const TOTAL = 9;
        let current = 0;
        
        const container = document.getElementById('container');
        const slides = document.getElementById('slides');
        const dots = document.getElementById('dots');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('counter');

        // ドット生成
        for (let i = 0; i < TOTAL; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (i === 0) dot.classList.add('active');
            dot.onclick = () => goTo(i);
            dots.appendChild(dot);
        }

        // 更新処理
        function update() {
            const width = container.offsetWidth;
            slides.style.transform = `translateX(${-current * width}px)`;
            
            // ドット更新
            const allDots = dots.querySelectorAll('.dot');
            allDots.forEach((dot, i) => {
                if (i === current) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            
            // 矢印表示制御
            if (current > 0) {
                prevBtn.classList.add('visible');
            } else {
                prevBtn.classList.remove('visible');
            }
            
            if (current < TOTAL - 1) {
                nextBtn.classList.add('visible');
            } else {
                nextBtn.classList.remove('visible');
            }
            
            // カウンター更新
            counter.textContent = `${current + 1} / ${TOTAL}`;
        }

        // ページ移動
        function goTo(index) {
            if (index >= 0 && index < TOTAL) {
                current = index;
                update();
            }
        }

        function next() {
            if (current < TOTAL - 1) {
                current++;
                update();
            }
        }

        function prev() {
            if (current > 0) {
                current--;
                update();
            }
        }

        // 矢印ボタン
        prevBtn.onclick = prev;
        nextBtn.onclick = next;

        // スワイプ操作
        let startX = 0;
        let startY = 0;
        
        container.ontouchstart = (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        };

        container.ontouchmove = (e) => {
            // 縦スクロール防止
            e.preventDefault();
        };

        container.ontouchend = (e) => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const diffX = startX - endX;
            const diffY = startY - endY;
            
            // 横方向の動きが優勢な場合のみスワイプ判定
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX > 0) {
                    next();
                } else {
                    prev();
                }
            }
        };

        // キーボード操作
        document.onkeydown = (e) => {
            if (e.key === 'ArrowLeft') prev();
            if (e.key === 'ArrowRight') next();
        };

        // 画面回転・リサイズ対応
        let resizeTimer = null;
        
        window.onresize = () => {
            // トランジション一時無効化
            slides.classList.add('no-transition');
            
            // タイマークリア
            if (resizeTimer) {
                clearTimeout(resizeTimer);
            }
            
            // 即座に位置更新
            update();
            
            // 100ms後にトランジション復活
            resizeTimer = setTimeout(() => {
                slides.classList.remove('no-transition');
            }, 100);
        };

        // 初期表示
        update();
    </script>
</body>

</html>
</body>

</html>
