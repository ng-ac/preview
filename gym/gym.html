<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* ローディング画面 */
        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        .loading-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            max-width: 300px;
            width: 80%;
            height: auto;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 3rem;
            color: #333;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .top-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            z-index: 200;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        @media (max-height: 768px) {
            .top-button {
                top: 15px;
                left: 15px;
                padding: 10px 18px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <!-- ローディング画面 -->
    <div id="loadingScreen" class="loading-screen">
        <img src="/preview/main/road.jpg" alt="Loading" class="loading-logo">
        <div class="loading-spinner"></div>
    </div>

    <a href="/preview/main/main.html" class="top-button">TOP</a>
    <h1>coming soon...</h1>

    <script>
        const loadingScreen = document.getElementById('loadingScreen');

        // 2秒後にローディング画面を非表示
        setTimeout(() => {
            loadingScreen.classList.add('hide');
        }, 2000);
    </script>
</body>

</html>
