<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* PWA起動時の透明タップエリア（iOS対策） */
        .tap-to-start {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .tap-to-start.show {
            opacity: 1;
        }

        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            border-radius: 5px;
            max-width: 90%;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="debugInfo" class="debug-info"></div>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- PWA起動時の透明タップエリア -->
    <div id="tapToStart" class="tap-to-start"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let debugEl = document.getElementById('debugInfo');
        let hasPlayStarted = false;

        function updateDebug(msg) {
            const timestamp = new Date().toLocaleTimeString();
            debugEl.innerHTML = `[${timestamp}] ${msg}<br>` + debugEl.innerHTML;
        }

        updateDebug('🚀 Script loaded');

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.defaultMuted = true;
            v.volume = 0;
        }

        // 詳細な動画情報を表示
        videoEl.addEventListener('loadedmetadata', () => {
            updateDebug(`📊 Video info:
- Size: ${videoEl.videoWidth}x${videoEl.videoHeight}
- Duration: ${videoEl.duration}s
- ReadyState: ${videoEl.readyState}`);
        });

        videoEl.addEventListener('playing', () => {
            updateDebug('▶️ PLAYING event');
        });

        videoEl.addEventListener('pause', () => {
            updateDebug('⏸️ PAUSE event');
        });

        videoEl.addEventListener('waiting', () => {
            updateDebug('⏳ WAITING (buffering)');
        });

        videoEl.addEventListener('stalled', () => {
            updateDebug('⚠️ STALLED');
        });

        videoEl.addEventListener('error', (e) => {
            const err = videoEl.error;
            if (err) {
                updateDebug(`💥 ERROR code: ${err.code}
1=ABORTED, 2=NETWORK, 3=DECODE, 4=NOT_SUPPORTED`);
            }
        });

        // 実際の再生を監視
        let lastTime = 0;
        let checkCount = 0;
        videoEl.addEventListener('timeupdate', () => {
            if (videoEl.currentTime > lastTime) {
                if (checkCount === 0) {
                    updateDebug(`✅ ACTUALLY PLAYING! (${videoEl.currentTime.toFixed(2)}s)`);
                }
                checkCount++;
                if (checkCount === 1) {
                    // 再生確認できたら5秒後にデバッグ非表示
                    setTimeout(() => { debugEl.style.display = 'none'; }, 5000);
                }
            }
            lastTime = videoEl.currentTime;
        });

        async function playVideo() {
            if (hasPlayStarted) return;
            hasPlayStarted = true;

            updateDebug('🎬 Starting playback...');

            setVideoFlags(videoEl);

            // キャッシュバスター付きで強制再読み込み
            const cacheBuster = '?t=' + Date.now();
            updateDebug('📥 Loading video with cache buster');
            videoEl.src = VIDEO_PATH + cacheBuster;
            videoEl.load();

            // メタデータ読み込み待ち
            await new Promise(resolve => {
                if (videoEl.readyState >= 1) {
                    resolve();
                } else {
                    videoEl.addEventListener('loadedmetadata', resolve, { once: true });
                    setTimeout(resolve, 5000);
                }
            });

            updateDebug(`✓ Metadata loaded (ready: ${videoEl.readyState})`);

            // 十分なデータ待ち
            if (videoEl.readyState < 3) {
                updateDebug('⏳ Waiting for enough data...');
                await new Promise(resolve => {
                    videoEl.addEventListener('canplay', resolve, { once: true });
                    setTimeout(resolve, 5000);
                });
            }

            updateDebug(`✓ Can play (ready: ${videoEl.readyState})`);

            try {
                videoEl.currentTime = 0;
                updateDebug('▶️ Calling play()...');
                const playPromise = videoEl.play();

                if (playPromise !== undefined) {
                    await playPromise;
                    updateDebug(`✅ play() success (paused: ${videoEl.paused})`);
                }

                // 1秒後に状態確認
                setTimeout(() => {
                    updateDebug(`🔍 After 1s: time=${videoEl.currentTime.toFixed(2)}s, paused=${videoEl.paused}`);

                    if (videoEl.paused || videoEl.currentTime === 0) {
                        updateDebug('⚠️ NOT MOVING! Forcing play again...');
                        videoEl.play();
                    }
                }, 1000);

            } catch (err) {
                updateDebug(`❌ ${err.name}: ${err.message}`);
                hasPlayStarted = false;
            }
        }

        function onEnded() {
            updateDebug('🏁 Video ended');
            try {
                videoEl.pause();
                const d = videoEl.duration || 0;
                videoEl.currentTime = Math.max(0, d - 0.06);
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // 初期化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                updateDebug('✓ DOM ready');
                setTimeout(playVideo, 100);
            });
        } else {
            updateDebug('✓ DOM already ready');
            setTimeout(playVideo, 100);
        }

        window.addEventListener('load', () => {
            updateDebug('✓ Window loaded');
            if (!hasPlayStarted) setTimeout(playVideo, 200);
        });

        window.addEventListener('pageshow', () => {
            updateDebug('📄 pageshow');
            hasPlayStarted = false;
            setTimeout(playVideo, 100);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !hasPlayStarted) {
                updateDebug('👁️ Visible');
                setTimeout(playVideo, 100);
            }
        });

        let touchHandled = false;
        document.addEventListener('touchstart', () => {
            if (!touchHandled) {
                touchHandled = true;
                updateDebug('👆 Touch - forcing play');
                hasPlayStarted = false;
                playVideo();
            }
        }, { once: true, passive: true });

        updateDebug('✓ Setup complete');
    </script>
</body>

</html>
