<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <link rel="stylesheet" href="/preview/main/main.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        /* 背景動画（1回だけ再生） */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }
    </style>
</head>

<body>
    <!-- 背景動画（1回だけ再生） -->
    <video class="bg-video" id="bgVideo" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture>
        <source src="./main.mp4" type="video/mp4">
    </video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        const v = document.getElementById('bgVideo');
        const tap = document.getElementById('tapToStart');

        function tryPlay() {
            if (!v) return;
            v.muted = true; // iOS用に明示
            const p = v.play();
            if (p && typeof p.catch === 'function') {
                p.catch(() => {
                    // 自動再生失敗 → タップ誘導を出す
                    tap.style.display = 'block';
                });
            }
        }

        // いろんなタイミングで再生を試みる（PWA/iOSの気まぐれ対策）
        document.addEventListener('DOMContentLoaded', tryPlay);
        window.addEventListener('load', tryPlay);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });

        // ユーザー操作があれば確実に再生
        ['touchend', 'click'].forEach(ev => {
            document.addEventListener(ev, () => { tryPlay(); tap.style.display = 'none'; }, { once: true });
            tap.addEventListener(ev, () => { tryPlay(); tap.style.display = 'none'; }, { once: true });
        });

        // 1回だけ再生して停止（最後のフレーム保持）
        v.addEventListener('ended', () => {
            v.pause();
            v.currentTime = v.duration;
        });
    </script>
</body>

</html>
