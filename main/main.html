<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA関連 -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            background: #000;
        }

        /* 背景動画 */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            /* クリックは上のoverlayへ */
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        /* 透明リンク（位置は main.css で指定） */
        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* 再生フォールバック */
        .tap-to-play {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 10;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            -webkit-tap-highlight-color: transparent;
        }

        .tap-to-play button {
            font: 600 16px/1 'Poppins', 'Noto Sans JP', sans-serif;
            padding: 14px 20px;
            border-radius: 9999px;
            border: none;
            background: #fff;
            color: #111;
            letter-spacing: .02em;
        }
    </style>
</head>

<body>
    <!-- 背景動画（srcはJSでBlob URLを設定） -->
    <video class="bg-video" id="bgVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture
        disableRemotePlayback></video>

    <!-- 透明リンク -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- 再生できない場合のフォールバック -->
    <div class="tap-to-play" id="tapToPlay">
        <button type="button" id="tapToPlayBtn">タップして再生</button>
    </div>

    <script>
        // =============== シンプル安定版 再生ロジック ===============
        const VIDEO_PATH = '/preview/main/main.mp4';
        const v = document.getElementById('bgVideo');
        const tap = document.getElementById('tapToPlay');
        const tapBtn = document.getElementById('tapToPlayBtn');
        let blobUrl = null;

        function setVideoProps() {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
            v.removeAttribute('poster');
        }

        function showTap() { tap.style.display = 'flex'; }
        function hideTap() { tap.style.display = 'none'; }

        function revokeBlob() {
            if (blobUrl) {
                try { URL.revokeObjectURL(blobUrl); } catch (_) { }
                blobUrl = null;
            }
        }

        // CacheStorage → Blob → objectURL → video.src
        async function loadVideoFromCacheOrNetwork() {
            // 1) CacheStorage を優先
            let resp = null;
            try {
                if ('caches' in window) {
                    resp = await caches.match(VIDEO_PATH, { ignoreSearch: true });
                }
            } catch (_) { }

            // 2) 無ければ fetch（成功したら Cache に保存）
            if (!resp) {
                resp = await fetch(VIDEO_PATH, { method: 'GET' });
                if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
                try {
                    if ('caches' in window) {
                        const cache = await caches.open('video-cache-simple');
                        // 正規化キーで保存（クエリ無視）
                        await cache.put(VIDEO_PATH, resp.clone());
                    }
                } catch (_) { }
            }

            const blob = await resp.blob();
            revokeBlob();
            blobUrl = URL.createObjectURL(blob);

            // video に適用
            setVideoProps();
            v.removeAttribute('src');
            v.src = blobUrl;
            v.load();

            // ready（2秒タイムアウト）
            await Promise.race([
                new Promise(res => v.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
        }

        async function startPlay() {
            try {
                await loadVideoFromCacheOrNetwork();
                try { v.currentTime = 0; } catch (_) { }
                await v.play();
                hideTap();
            } catch (_) {
                // 自動再生が弾かれたら最小限のフォールバックだけ出す
                showTap();
            }
        }

        // 終了時は「最後のフレームで静止」
        v.addEventListener('ended', async () => {
            try {
                v.pause();
                const d = Number.isFinite(v.duration) ? v.duration : 0;
                const t = Math.max(0, d - 0.06);
                v.currentTime = t;
                try {
                    const p = v.play();
                    if (p && typeof p.then === 'function') await p.catch(() => { });
                } catch (_) { }
                v.pause();
            } catch (_) { }
        });

        // タップで再生（1回だけ）
        tapBtn.addEventListener('click', async () => {
            hideTap();
            await startPlay();
        }, { passive: true });

        // 起動時に1回だけ実行（イベント乱発はしない）
        window.addEventListener('load', startPlay);

        // ページ離脱で Blob URL を解放
        window.addEventListener('beforeunload', revokeBlob);

        // Service Worker 登録（任意・既存のままでOK）
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('/preview/service-worker.js', { scope: '/preview/' })
                .catch(() => { });
        }
    </script>
</body>

</html>
