<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA関連 -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            background: #000;
        }

        /* 背景動画 */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }
    </style>
</head>

<body>
    <!-- 背景動画（1回だけ再生） -->
    <video class="bg-video" id="bgVideo" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture>
        <source src="/preview/main/main.mp4" type="video/mp4">
    </video>

    <!-- 透明リンク（各ボタン位置に対応） -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        // === 背景動画の再生制御（PWA対応強化版） ===
        const v = document.getElementById('bgVideo');

        function setProps() {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.setAttribute('muted', '');
            v.autoplay = true;
            v.defaultMuted = true;
        }

        async function tryPlay() {
            setProps();

            // 動画を最初から再読み込み
            v.load();

            try {
                const playPromise = v.play();
                if (playPromise !== undefined) {
                    await playPromise;
                }
            } catch (err) {
                // 失敗時は少し待ってリトライ
                setTimeout(async () => {
                    try {
                        await v.play();
                    } catch (e) {
                        // 最終手段：ユーザー操作を待つ
                        document.addEventListener('touchstart', () => v.play(), { once: true, passive: true });
                    }
                }, 100);
            }
        }

        // 複数タイミングで再生試行
        document.addEventListener('DOMContentLoaded', tryPlay);
        window.addEventListener('load', tryPlay);
        window.addEventListener('pageshow', tryPlay);
        window.addEventListener('focus', tryPlay);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) tryPlay();
        });

        // PWA起動時も即座に試行
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            setTimeout(tryPlay, 100);
            setTimeout(tryPlay, 500);
        }

        // 念のためタッチイベントでも試行
        ['touchstart', 'click'].forEach(ev => {
            document.addEventListener(ev, () => tryPlay(), { once: true, passive: true });
        });

        // 再生終了時の処理
        v.addEventListener('ended', () => {
            v.pause();
            v.currentTime = v.duration;
        });

        // === Service Worker 登録 ===
        if ('serviceWorker' in navigator &&
            (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('/preview/service-worker.js', { scope: './' })
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>

</html>
