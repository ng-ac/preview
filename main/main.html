<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* PWA起動時の透明タップエリア（iOS対策） */
        .tap-to-start {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .tap-to-start.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- PWA起動時の透明タップエリア -->
    <div id="tapToStart" class="tap-to-start"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let tapOverlay = document.getElementById('tapToStart');
        let blobUrl = null;
        let hasPlayedOnce = false;
        let isPreparingVideo = false;

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
            v.removeAttribute('poster');
        }

        function revokeBlob() {
            if (blobUrl) {
                try { URL.revokeObjectURL(blobUrl); } catch { }
                blobUrl = null;
            }
        }

        async function fetchVideoResponse() {
            try {
                if ('caches' in window) {
                    const cached = await caches.match(VIDEO_PATH, { ignoreSearch: true });
                    if (cached) return cached;
                }
            } catch { }
            const resp = await fetch(VIDEO_PATH, { method: 'GET' });
            if (!resp.ok) throw new Error('video fetch failed: ' + resp.status);
            try {
                if ('caches' in window) {
                    const c = await caches.open('video-cache-simple');
                    await c.put(VIDEO_PATH, resp.clone());
                }
            } catch { }
            return resp;
        }

        async function prepareBlobSource() {
            if (isPreparingVideo) return;
            isPreparingVideo = true;

            revokeBlob();
            const resp = await fetchVideoResponse();
            const blob = await resp.blob();
            blobUrl = URL.createObjectURL(blob);

            try { videoEl.pause(); } catch { }
            videoEl.removeAttribute('src');
            videoEl.src = blobUrl;
            videoEl.load();

            await Promise.race([
                new Promise(res => videoEl.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 3000))
            ]);

            isPreparingVideo = false;
        }

        async function tryPlayVideo() {
            if (hasPlayedOnce) return true;

            setVideoFlags(videoEl);

            if (!blobUrl) {
                await prepareBlobSource();
            }

            try { videoEl.currentTime = 0; } catch { }

            try {
                const playPromise = videoEl.play();
                if (playPromise) {
                    await playPromise;
                }

                // 再生成功を確認
                await new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error('timeout')), 1500);
                    const onPlay = () => {
                        clearTimeout(timer);
                        videoEl.removeEventListener('playing', onPlay);
                        videoEl.removeEventListener('timeupdate', onPlay);
                        resolve();
                    };
                    videoEl.addEventListener('playing', onPlay, { once: true });
                    videoEl.addEventListener('timeupdate', onPlay, { once: true });
                });

                hasPlayedOnce = true;
                hideTapOverlay();
                return true;

            } catch (err) {
                return false;
            }
        }

        function showTapOverlay() {
            tapOverlay.classList.add('show');
            tapOverlay.style.pointerEvents = 'auto';
        }

        function hideTapOverlay() {
            tapOverlay.classList.remove('show');
            setTimeout(() => {
                tapOverlay.style.pointerEvents = 'none';
            }, 300);
        }

        // ユーザーインタラクション時の再生
        async function handleUserInteraction() {
            const success = await tryPlayVideo();
            if (success) {
                // 全てのイベントリスナーを削除
                document.removeEventListener('touchstart', handleUserInteraction);
                document.removeEventListener('touchend', handleUserInteraction);
                document.removeEventListener('click', handleUserInteraction);
                tapOverlay.removeEventListener('touchstart', handleUserInteraction);
                tapOverlay.removeEventListener('click', handleUserInteraction);
            }
        }

        // 終了時処理
        async function onEnded() {
            try {
                videoEl.pause();
                const d = Number.isFinite(videoEl.duration) ? videoEl.duration : 0;
                const t = Math.max(0, d - 0.06);
                videoEl.currentTime = t;
                try {
                    const p = videoEl.play();
                    if (p && typeof p.then === 'function') await p.catch(() => { });
                } catch { }
                videoEl.pause();
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // 初期化処理
        async function initVideo() {
            // 動画準備（バックグラウンド）
            prepareBlobSource();

            // まず自動再生を試行
            const success = await tryPlayVideo();

            if (!success) {
                // 自動再生失敗 → ユーザーインタラクション待ち
                showTapOverlay();

                // 複数のイベントで確実にキャッチ
                document.addEventListener('touchstart', handleUserInteraction, { passive: true });
                document.addEventListener('touchend', handleUserInteraction, { passive: true });
                document.addEventListener('click', handleUserInteraction);
                tapOverlay.addEventListener('touchstart', handleUserInteraction, { passive: true });
                tapOverlay.addEventListener('click', handleUserInteraction);
            }
        }

        // PWA起動検知（複数トリガー）
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVideo);
        } else {
            initVideo();
        }

        window.addEventListener('load', () => {
            if (!hasPlayedOnce) {
                setTimeout(initVideo, 100);
            }
        });

        // 戻ってきた時
        window.addEventListener('pageshow', (e) => {
            if (e.persisted || !hasPlayedOnce) {
                hasPlayedOnce = false;
                initVideo();
            }
        });

        // visibilitychange（PWA復帰時）
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !hasPlayedOnce) {
                initVideo();
            }
        });

        // focus（PWA復帰時の追加トリガー）
        window.addEventListener('focus', () => {
            if (!hasPlayedOnce) {
                setTimeout(initVideo, 50);
            }
        });

        // メモリ解放
        window.addEventListener('pagehide', revokeBlob);
        window.addEventListener('beforeunload', revokeBlob);
    </script>
</body>

</html>
