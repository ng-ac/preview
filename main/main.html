<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA関連 -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            background: #000;
        }

        /* 背景動画 */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }

        /* 透明リンク（ボタン位置は main.css 側で調整想定） */
        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* 再生失敗時のタップUI */
        .tap-to-play {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 10;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            -webkit-tap-highlight-color: transparent;
        }

        .tap-to-play button {
            font: 600 16px/1 'Poppins', 'Noto Sans JP', sans-serif;
            padding: 14px 20px;
            border-radius: 9999px;
            border: none;
            background: #ffffff;
            color: #111;
            letter-spacing: .02em;
        }
    </style>
</head>

<body>
    <!-- 背景動画 -->
    <video class="bg-video" id="bgVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture
        disableRemotePlayback>
        <source src="/preview/main/main.mp4" type="video/mp4">
    </video>

    <!-- 透明リンク -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- 再生できない場合のフォールバックUI -->
    <div class="tap-to-play" id="tapToPlay">
        <button type="button" id="tapToPlayBtn">タップして再生</button>
    </div>

    <script>
        // ===============================
        // 背景動画：再入場で固まる問題の対策込み
        // ===============================
        const BASE_VIDEO_PATH = '/preview/main/main.mp4'; // SWはパスで正規化キャッシュする想定（v5）
        const v = document.getElementById('bgVideo');
        const tap = document.getElementById('tapToPlay');
        const tapBtn = document.getElementById('tapToPlayBtn');

        let playLock = false;   // 多重 play() 防止
        let lastPlayAt = 0;     // 短時間呼び出し抑制
        let retryCount = 0;

        function isStandalone() {
            // iOS Safari PWA または他OSのstandalone
            return window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
        }

        function setVideoProps() {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
            // 念のためポスターは持たせない（固着印象を避ける）
            v.removeAttribute('poster');
        }

        // 軽いキャッシュバスター（同一URL問題の回避）
        function makeBustedUrl() {
            // 起動毎に変わる値（timeOrigin相当）で十分
            const bust = Date.now().toString(36);
            return `${BASE_VIDEO_PATH}?v=${bust}`;
        }

        async function softReloadSource(withBuster = true) {
            const srcEl = v.querySelector('source') || document.createElement('source');
            const nextUrl = withBuster ? makeBustedUrl() : BASE_VIDEO_PATH;

            if (!srcEl.parentNode) {
                srcEl.type = 'video/mp4';
                v.appendChild(srcEl);
            }
            // 同じURLなら無理に差し替え
            if (srcEl.src.replace(location.origin, '') === nextUrl) {
                try { v.removeAttribute('src'); } catch (_) { }
            }
            srcEl.src = nextUrl;

            v.load();

            // loadeddata を待つ（タイムアウト2秒）
            await Promise.race([
                new Promise(res => v.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
        }

        // どうしても駄目なときはvideo要素を完全再生成
        async function hardResetVideo() {
            try { v.pause(); } catch (_) { }
            try { v.removeAttribute('src'); } catch (_) { }
            while (v.firstChild) v.removeChild(v.firstChild);

            const srcEl = document.createElement('source');
            srcEl.type = 'video/mp4';
            srcEl.src = makeBustedUrl();
            v.appendChild(srcEl);

            setVideoProps();
            v.load();

            await Promise.race([
                new Promise(res => v.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
        }

        async function tryPlayOnce({ useBuster = true, hardReset = false } = {}) {
            setVideoProps();

            if (hardReset) {
                await hardResetVideo();
            } else {
                await softReloadSource(useBuster);
            }

            try {
                // iOSでたまに末尾で固着するので開始前に先頭へ
                try { if (!Number.isFinite(v.currentTime) || v.currentTime > 0.1) v.currentTime = 0; } catch (_) { }
                await v.play();
                retryCount = 0;
                hideTap();
                console.log(`✓ video playing (${hardReset ? 'hard' : 'soft'} / buster:${useBuster})`);
                return true;
            } catch (err) {
                console.log('play failed:', err && err.name || err);
                return false;
            }
        }

        async function forcePlay() {
            const now = Date.now();
            if (playLock || (now - lastPlayAt) < 400) return;
            playLock = true; lastPlayAt = now;

            // 再生シーケンス：
            // 1) 軽いキャッシュバスター付きでソフト再読込
            // 2) ダメならバスター無しで再読込
            // 3) さらにダメなら video 要素を丸ごと再生成（ハードリセット）
            let ok = await tryPlayOnce({ useBuster: true, hardReset: false });

            if (!ok) {
                ok = await tryPlayOnce({ useBuster: false, hardReset: false });
            }
            if (!ok) {
                ok = await tryPlayOnce({ useBuster: true, hardReset: true });
            }

            // 自動再生が弾かれる／メディア復元がだめな時はタップ誘導
            if (!ok) showTap();

            playLock = false;
        }

        function showTap() { tap.style.display = 'flex'; }
        function hideTap() { tap.style.display = 'none'; }

        // 再生終了時：末尾で固着しないよう先頭に戻す
        v.addEventListener('ended', () => {
            try { v.pause(); v.currentTime = 0; } catch (_) { }
        });

        // タップで強制再生
        tapBtn.addEventListener('click', () => { hideTap(); forcePlay(); }, { passive: true });
        document.addEventListener('touchstart', () => { hideTap(); forcePlay(); }, { once: true, passive: true });

        // 初回（ホーム画面起動含む）
        window.addEventListener('load', forcePlay);

        // アプリ復帰・再表示時（PWAの2回目以降の起動含む）
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) setTimeout(forcePlay, 80);
        });
        window.addEventListener('pageshow', (ev) => {
            // BFCache復元時も念のため復旧
            if (ev && ev.persisted) {
                setTimeout(forcePlay, 80);
            } else {
                setTimeout(forcePlay, 80);
            }
        });
        window.addEventListener('focus', () => { setTimeout(forcePlay, 80); });

        // ===============================
        // Service Worker 登録（前回と同じ）
        // ===============================
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('/preview/service-worker.js', { scope: '/preview/' })
                .then(reg => { console.log('SW registered', reg.scope); })
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>

</html>
