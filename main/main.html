<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <link rel="stylesheet" href="./main.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        /* 背景動画（1回だけ再生） */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }
    </style>
</head>

<body>
    <!-- 背景動画（1回だけ再生） -->
    <video class="bg-video" autoplay muted playsinline preload="auto" disablepictureinpicture id="bgVideo">
        <source src="./main.mp4" type="video/mp4">
    </video>

    <div class="overlay">
        <a href="../yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="../gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="../tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        // 一回だけ再生して最後のフレームで停止
        const video = document.getElementById('bgVideo');
        video.addEventListener('ended', () => {
            video.pause();
            video.currentTime = video.duration;
        });
        document.addEventListener('touchstart', () => { if (video.paused) video.play(); });

        // Service Worker 登録（そのまま）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/preview/service-worker.js')
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
