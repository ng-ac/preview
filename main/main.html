<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA関連 -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            background: #000;
        }

        /* 背景動画 */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }
    </style>
</head>

<body>
    <!-- 背景動画（1回だけ再生） -->
    <video class="bg-video" id="bgVideo" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture>
        <source src="/preview/main/main.mp4" type="video/mp4">
    </video>

    <!-- 透明リンク（各ボタン位置に対応） -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        // === 背景動画の再生制御（PWA再起動対応版） ===
        const v = document.getElementById('bgVideo');

        function setProps() {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.setAttribute('muted', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
        }

        async function forceReload() {
            // 動画を完全にリセット
            const source = v.querySelector('source');
            const originalSrc = source.src;

            // キャッシュバスター付きで再読み込み
            v.pause();
            v.removeAttribute('src');
            source.removeAttribute('src');
            v.load();

            // 少し待ってから再設定
            await new Promise(resolve => setTimeout(resolve, 50));

            source.src = originalSrc + '?t=' + Date.now();
            v.load();

            return new Promise(resolve => {
                v.addEventListener('loadeddata', resolve, { once: true });
                setTimeout(resolve, 1000); // タイムアウト
            });
        }

        async function tryPlay() {
            setProps();

            try {
                await forceReload();
                await v.play();
            } catch (err) {
                console.log('First play failed, retrying...', err);
                setTimeout(async () => {
                    try {
                        v.load();
                        await v.play();
                    } catch (e) {
                        console.log('Retry failed:', e);
                    }
                }, 300);
            }
        }

        // 初回読み込み
        window.addEventListener('load', tryPlay);

        // PWA再起動時の検出と対応
        let isFirstLoad = true;
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                if (!isFirstLoad) {
                    // 2回目以降の起動
                    setTimeout(tryPlay, 100);
                }
                isFirstLoad = false;
            }
        });

        // pageshow（キャッシュ復帰時）
        window.addEventListener('pageshow', (event) => {
            if (event.persisted || performance.navigation.type === 2) {
                // bfcacheから復帰した場合
                setTimeout(tryPlay, 100);
            }
        });

        // 念のためユーザー操作でも
        ['touchstart', 'click'].forEach(ev => {
            document.addEventListener(ev, () => {
                if (v.paused) tryPlay();
            }, { once: true, passive: true });
        });

        // 再生終了時
        v.addEventListener('ended', () => {
            v.pause();
            v.currentTime = v.duration;
        });

        // === Service Worker 登録 ===
        if ('serviceWorker' in navigator &&
            (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('/preview/service-worker.js', { scope: './' })
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>

</html>
