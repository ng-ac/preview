<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* PWA起動時の透明タップエリア（iOS対策） */
        .tap-to-start {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .tap-to-start.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- PWA起動時の透明タップエリア -->
    <div id="tapToStart" class="tap-to-start"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let blobUrl = null;
        let playAttempted = false;

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
            v.preload = 'auto';
            v.removeAttribute('poster');
        }

        function revokeBlob() {
            if (blobUrl) {
                try { URL.revokeObjectURL(blobUrl); } catch { }
                blobUrl = null;
            }
        }

        async function fetchVideoResponse() {
            try {
                if ('caches' in window) {
                    const cached = await caches.match(VIDEO_PATH, { ignoreSearch: true });
                    if (cached) return cached;
                }
            } catch { }
            const resp = await fetch(VIDEO_PATH, { method: 'GET' });
            if (!resp.ok) throw new Error('video fetch failed: ' + resp.status);
            try {
                if ('caches' in window) {
                    const c = await caches.open('video-cache-simple');
                    await c.put(VIDEO_PATH, resp.clone());
                }
            } catch { }
            return resp;
        }

        // 動画ソース設定（Blob URL使わずに直接パス指定）
        function setDirectSource() {
            videoEl.removeAttribute('src');
            videoEl.src = VIDEO_PATH;
            videoEl.load();
        }

        // 強制的に再生を試みる（複数回リトライ）
        async function forcePlay(retries = 5) {
            if (playAttempted) return;

            setVideoFlags(videoEl);

            for (let i = 0; i < retries; i++) {
                try {
                    videoEl.currentTime = 0;

                    const playPromise = videoEl.play();
                    if (playPromise !== undefined) {
                        await playPromise;

                        // 実際に再生が始まったか確認
                        await new Promise((resolve, reject) => {
                            const timeout = setTimeout(() => reject(), 800);

                            const checkPlaying = () => {
                                if (!videoEl.paused && videoEl.currentTime > 0) {
                                    clearTimeout(timeout);
                                    videoEl.removeEventListener('timeupdate', checkPlaying);
                                    resolve();
                                }
                            };

                            videoEl.addEventListener('timeupdate', checkPlaying);
                            checkPlaying(); // 即座チェック
                        });

                        // 成功
                        playAttempted = true;
                        return true;
                    }
                } catch (err) {
                    // リトライ前に少し待つ
                    await new Promise(r => setTimeout(r, 200));
                }
            }

            return false;
        }

        // 終了時処理
        function onEnded() {
            try {
                videoEl.pause();
                const d = Number.isFinite(videoEl.duration) ? videoEl.duration : 0;
                videoEl.currentTime = Math.max(0, d - 0.06);
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // メイン初期化（即座実行）
        (async function init() {
            // 1. 動画ソース設定（キャッシュから即座ロード）
            setDirectSource();

            // 2. loadedmetadata待ち（メタデータ読み込み完了）
            await new Promise(resolve => {
                if (videoEl.readyState >= 1) {
                    resolve();
                } else {
                    videoEl.addEventListener('loadedmetadata', resolve, { once: true });
                    setTimeout(resolve, 2000); // タイムアウト
                }
            });

            // 3. 即座に再生試行
            const success = await forcePlay();

            // 4. 失敗した場合の追加トリガー設定
            if (!success) {
                // ページ表示直後の再試行
                setTimeout(() => forcePlay(), 300);
                setTimeout(() => forcePlay(), 600);
                setTimeout(() => forcePlay(), 1000);

                // visibilitychange（フォアグラウンド復帰時）
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        playAttempted = false;
                        setTimeout(() => forcePlay(), 100);
                    }
                });

                // focus（ウィンドウフォーカス時）
                window.addEventListener('focus', () => {
                    playAttempted = false;
                    setTimeout(() => forcePlay(), 100);
                });
            }
        })();

        // pageshow（履歴戻り・PWA復帰）
        window.addEventListener('pageshow', (e) => {
            playAttempted = false;
            setTimeout(() => forcePlay(), 100);
        });

        // メモリ解放
        window.addEventListener('pagehide', revokeBlob);
        window.addEventListener('beforeunload', revokeBlob);
    </script>
</body>

</html>
