<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- src は毎回JSで割り当て（Blob URL） -->
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <!-- 透明リンク（位置は main.css で調整） -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        // ===== 要件：起動/戻りで毎回「確実に1回」再生、終了時は最後のフレームで停止 =====
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let blobUrl = null;
        let playedThisCycle = false;
        let retried = false;

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
            v.removeAttribute('poster');
        }

        function revokeBlob() {
            if (blobUrl) {
                try { URL.revokeObjectURL(blobUrl); } catch { }
                blobUrl = null;
            }
        }

        async function fetchVideoResponse() {
            try {
                if ('caches' in window) {
                    const cached = await caches.match(VIDEO_PATH, { ignoreSearch: true });
                    if (cached) return cached;
                }
            } catch { }
            const resp = await fetch(VIDEO_PATH, { method: 'GET' });
            if (!resp.ok) throw new Error('video fetch failed: ' + resp.status);
            try {
                if ('caches' in window) {
                    const c = await caches.open('video-cache-simple');
                    await c.put(VIDEO_PATH, resp.clone());
                }
            } catch { }
            return resp;
        }

        function hardResetElement() {
            const parent = videoEl.parentNode;
            const next = document.createElement('video');
            next.id = 'bgVideo';
            next.className = 'bg-video';
            next.setAttribute('autoplay', '');
            next.setAttribute('muted', '');
            next.setAttribute('playsinline', '');
            next.setAttribute('webkit-playsinline', '');
            next.setAttribute('preload', 'auto');
            next.setAttribute('disablepictureinpicture', '');
            next.setAttribute('disableRemotePlayback', '');
            next.setAttribute('x-webkit-airplay', 'deny');

            next.addEventListener('ended', onEnded);

            parent.replaceChild(next, videoEl);
            videoEl = next;
            setVideoFlags(videoEl);
        }

        async function prepareBlobSource() {
            revokeBlob();
            const resp = await fetchVideoResponse();
            const blob = await resp.blob();
            blobUrl = URL.createObjectURL(blob);

            try { videoEl.pause(); } catch { }
            videoEl.removeAttribute('src');
            videoEl.src = blobUrl;
            videoEl.load();

            await Promise.race([
                new Promise(res => videoEl.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
        }

        async function playOnceWithWatchdog() {
            if (playedThisCycle) return;
            playedThisCycle = true;

            setVideoFlags(videoEl);
            await prepareBlobSource();

            try { videoEl.currentTime = 0; } catch { }
            let playPromise;
            try { playPromise = videoEl.play(); } catch { }

            const ok = await new Promise(resolve => {
                let fired = false;

                const onOK = () => { if (!fired) { fired = true; cleanup(); resolve(true); } };
                const onFail = () => { if (!fired) { fired = true; cleanup(); resolve(false); } };
                const timer = setTimeout(onFail, 1200);

                const cleanup = () => {
                    clearTimeout(timer);
                    videoEl.removeEventListener('playing', onOK);
                    videoEl.removeEventListener('timeupdate', onOK);
                    videoEl.removeEventListener('progress', onOK);
                };

                videoEl.addEventListener('playing', onOK, { once: true });
                videoEl.addEventListener('timeupdate', onOK, { once: true });
                videoEl.addEventListener('progress', onOK, { once: true });

                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => { });
                }
            });

            if (!ok && !retried) {
                retried = true;
                hardResetElement();
                playedThisCycle = false;
                await playOnceWithWatchdog();
            }
        }

        async function onEnded() {
            try {
                videoEl.pause();
                const d = Number.isFinite(videoEl.duration) ? videoEl.duration : 0;
                const t = Math.max(0, d - 0.06);
                videoEl.currentTime = t;
                try {
                    const p = videoEl.play();
                    if (p && typeof p.then === 'function') await p.catch(() => { });
                } catch { }
                videoEl.pause();
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // --- PWA対応：確実な起動検知 ---
        let initExecuted = false;

        async function initVideo() {
            if (initExecuted) return;
            initExecuted = true;
            retried = false;
            playedThisCycle = false;
            await playOnceWithWatchdog();
        }

        // 即座実行（PWA起動時）
        if (document.readyState !== 'loading') {
            initVideo();
        }

        // DOMContentLoaded
        document.addEventListener('DOMContentLoaded', initVideo);

        // load（最終保険）
        window.addEventListener('load', () => {
            setTimeout(initVideo, 100);
        });

        // 戻ってきた時
        window.addEventListener('pageshow', (e) => {
            initExecuted = false;
            initVideo();
        });

        // ユーザー操作時の保険（PWAで必要な場合）
        document.addEventListener('click', () => {
            if (!playedThisCycle) {
                initVideo();
            }
        }, { once: true });

        // メモリ解放
        window.addEventListener('pagehide', revokeBlob);
        window.addEventListener('beforeunload', revokeBlob);
    </script>
</body>

</html>
