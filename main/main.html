<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0 maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #fff;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* 背景画像 */
        .bg-image {
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            bottom: 0 !important;
            right: 0 !important;
            width: 100vw;
            height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            object-fit: cover;
            background: #000;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
            transform: translateZ(0);
        }

        .bg-image.show {
            opacity: 1;
        }

        .overlay {
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            bottom: 0 !important;
            right: 0 !important;
            z-index: 5;
            width: 100vw;
            height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            pointer-events: none;
        }

        /* スタート画面 */
        .start-screen {
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            bottom: 0 !important;
            right: 0 !important;
            width: 100vw;
            height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            z-index: 10;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 1;
            transition: opacity 0.8s ease;
            transform: translateZ(0);
        }

        .start-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .start-logo {
            max-width: 300px;
            width: 80%;
            height: auto;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ローディングスピナー */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- スタート画面 -->
    <div id="startScreen" class="start-screen">
        <img src="/preview/main/road.jpg" alt="Unlimited" class="start-logo">
        <div class="loading-spinner"></div>
    </div>

    <!-- 背景画像 -->
    <img id="bgImage" class="bg-image" src="/preview/main/main.jpeg" alt="background" />

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        const bgImage = document.getElementById('bgImage');
        const startScreen = document.getElementById('startScreen');
        const overlay = document.querySelector('.overlay');

        // 強制的に位置を修正
        function forcePosition() {
            window.scrollTo(0, 0);

            // 全要素の位置を強制リセット
            [document.documentElement, document.body, bgImage, startScreen, overlay].forEach(el => {
                if (el) {
                    el.style.top = '0px';
                    el.style.left = '0px';
                    el.style.transform = 'translate3d(0, 0, 0)';
                    el.style.margin = '0px';
                    el.style.padding = '0px';
                }
            });

            // スクロール位置を完全にリセット
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            window.pageYOffset = 0;
        }

        // ローディング画面の表示～終了
        function runStartup() {
            forcePosition();

            setTimeout(() => {
                forcePosition();
                bgImage.classList.add('show');
                startScreen.classList.add('hide');
            }, 2000);
        }

        window.addEventListener('load', () => {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }

            forcePosition();
            setTimeout(forcePosition, 50);
            setTimeout(forcePosition, 150);
            setTimeout(forcePosition, 300);
            setTimeout(forcePosition, 500);
            setTimeout(forcePosition, 800);

            runStartup();
        });

        window.addEventListener('pageshow', () => {
            forcePosition();
            setTimeout(forcePosition, 100);
            setTimeout(forcePosition, 300);
            runStartup();
        });

        window.addEventListener('resize', forcePosition);
        window.addEventListener('orientationchange', () => {
            setTimeout(forcePosition, 100);
            setTimeout(forcePosition, 300);
        });

        // ページ表示時も実行
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                forcePosition();
            }
        });

        // 初期実行
        forcePosition();
    </script>
</body>

</html>
