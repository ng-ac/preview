<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            background: #000;
        }

        /* 背景動画 */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        /* 透明リンク（レイアウトは main.css 側で） */
        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- src は JS で Blob URL を設定する -->
    <video class="bg-video" id="bgVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture
        disableRemotePlayback></video>

    <!-- 透明リンク -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        // ====== 要件：毎回1回だけ自動再生／終了後は最後のフレームで停止／戻った時も1回再生 ======
        const VIDEO_PATH = '/preview/main/main.mp4'; // 元の動画パス（SWがあればそこから供給されてもOK）
        const video = document.getElementById('bgVideo');

        let currentBlobUrl = null;
        let playingThisSession = false; // この表示サイクルで既に1回再生したか

        function setVideoFlags() {
            video.muted = true;
            video.playsInline = true;
            video.setAttribute('muted', '');
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.autoplay = true;
            video.defaultMuted = true;
            video.volume = 0;
            video.removeAttribute('poster');
        }

        function revokeBlobUrl() {
            if (currentBlobUrl) {
                try { URL.revokeObjectURL(currentBlobUrl); } catch (_) { }
                currentBlobUrl = null;
            }
        }

        // CacheStorage → Blob → objectURL → video.src
        async function getVideoBlobResponse() {
            // 1) まず CacheStorage を探す（オフライン/高速起動を優先）
            if ('caches' in window) {
                try {
                    const cached = await caches.match(VIDEO_PATH, { ignoreSearch: true });
                    if (cached) return cached;
                } catch (_) { }
            }
            // 2) 無ければ通常 fetch（SW がいればそこから返る）
            const resp = await fetch(VIDEO_PATH, { method: 'GET' });
            if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
            // 3) 将来のために軽く保存（失敗しても無視）
            if ('caches' in window) {
                try {
                    const cache = await caches.open('video-cache-simple');
                    await cache.put(VIDEO_PATH, resp.clone());
                } catch (_) { }
            }
            return resp;
        }

        async function prepareAndPlayOnce() {
            if (playingThisSession) return; // このサイクルでは1回だけ
            playingThisSession = true;

            setVideoFlags();
            revokeBlobUrl();

            // Blob URL を毎回生成（＝毎回ユニークURL→デコーダ確実初期化）
            const resp = await getVideoBlobResponse();
            const blob = await resp.blob();
            currentBlobUrl = URL.createObjectURL(blob);

            // いったん src を完全にクリアしてから差し替え（iOSの復元バグ回避）
            try { video.pause(); } catch (_) { }
            video.removeAttribute('src');
            video.src = currentBlobUrl;
            video.load();

            // 先頭から1回だけ再生
            await Promise.race([
                new Promise(res => video.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
            try { video.currentTime = 0; } catch (_) { }
            await video.play().catch(() => {/* 極稀に弾かれても今回はユーザー操作なしで継続 */ });
        }

        // 終了時は「最後のフレームで停止表示」
        video.addEventListener('ended', async () => {
            try {
                video.pause();
                const d = Number.isFinite(video.duration) ? video.duration : 0;
                const t = Math.max(0, d - 0.06); // 60ms手前にシークして最後の絵を出す
                video.currentTime = t;
                // 1フレームだけ描画させる
                try {
                    const p = video.play();
                    if (p && typeof p.then === 'function') await p.catch(() => { });
                } catch (_) { }
                video.pause();
            } catch (_) { }
        });

        // ---- 起動時：1回だけ再生 ----
        window.addEventListener('load', () => {
            playingThisSession = false;
            prepareAndPlayOnce();
        });

        // ---- 戻ってきた時（history back / PWA再表示含む）：また1回だけ再生 ----
        window.addEventListener('pageshow', () => {
            // 新しい表示サイクルごとにフラグをリセットして1回だけ再生
            playingThisSession = false;
            prepareAndPlayOnce();
        });

        // ページ離脱で Blob URL を解放（メモリリーク防止）
        window.addEventListener('pagehide', () => { revokeBlobUrl(); });
        window.addEventListener('beforeunload', () => { revokeBlobUrl(); });

        // SW 登録（任意・既存のままでOK）
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('/preview/service-worker.js', { scope: '/preview/' }).catch(() => { });
        }
    </script>
</body>

</html>
