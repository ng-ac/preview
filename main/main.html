<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー画面</title>

    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-image: url('/preview/main/main.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        /* 左側のメニュー */
        .menu {
            background-color: rgba(255, 255, 255, 0.7);
            /* 半透明の白背景 */
            padding: 60px 50px;
            border-radius: 0 15px 15px 0;
            display: flex;
            flex-direction: column;
            gap: 35px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .menu a {
            color: #333;
            font-size: 26px;
            text-decoration: none;
            font-weight: 900;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            padding-bottom: 6px;
        }

        @media (max-width: 600px) {
            .menu {
                padding: 30px 25px;
                gap: 25px;
            }

            .menu a {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <nav class="menu">
        <a href="/preview/yomogi/yomogi.html">ーよもぎ蒸し</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
    </nav>

    <script>
        // Service Worker 登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/preview/main/serviece-worker.js')
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
