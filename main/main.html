<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #fff;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* スタート画面 */
        .start-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .start-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .start-button {
            background: #000;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .start-button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <!-- スタート画面 -->
    <div id="startScreen" class="start-screen">
        <button id="startButton" class="start-button">Start</button>
    </div>

    <video id="bgVideo" class="bg-video" src="/preview/main/main.mp4" muted playsinline webkit-playsinline
        preload="auto"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        const videoEl = document.getElementById('bgVideo');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');
        let hasPlayedThisSession = false;

        videoEl.muted = true;
        videoEl.volume = 0;
        videoEl.defaultMuted = true;

        // Startボタンクリック時
        async function handleStart() {
            if (hasPlayedThisSession) return;
            hasPlayedThisSession = true;

            try {
                videoEl.currentTime = 0;
                await videoEl.play();

                // スタート画面をフェードアウト
                startScreen.classList.add('hide');
                setTimeout(() => {
                    startScreen.style.display = 'none';
                }, 500);

            } catch (err) {
                hasPlayedThisSession = false;
            }
        }

        startButton.addEventListener('click', handleStart);
        startButton.addEventListener('touchstart', handleStart, { passive: true });

        // 終了時：最後のフレームで停止
        videoEl.addEventListener('ended', () => {
            videoEl.pause();
            if (videoEl.duration) {
                videoEl.currentTime = Math.max(0, videoEl.duration - 0.06);
            }
        });

        // PWA復帰時：スタート画面を再表示
        window.addEventListener('pageshow', () => {
            if (!hasPlayedThisSession) {
                startScreen.style.display = 'flex';
                startScreen.classList.remove('hide');
            }
        });

        window.addEventListener('visibilitychange', () => {
            if (!document.hidden && !hasPlayedThisSession) {
                startScreen.style.display = 'flex';
                startScreen.classList.remove('hide');
            }
        });
    </script>
</body>

</html>
