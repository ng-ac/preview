<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* PWA起動時の透明タップエリア（iOS対策） */
        .tap-to-start {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .tap-to-start.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- PWA起動時の透明タップエリア -->
    <div id="tapToStart" class="tap-to-start"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let hasPlayed = false;

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.defaultMuted = true;
            v.volume = 0;
        }

        // シンプルな再生関数
        async function playVideo() {
            if (hasPlayed) return;

            setVideoFlags(videoEl);

            // srcが未設定なら設定
            if (!videoEl.src || videoEl.src === '') {
                videoEl.src = VIDEO_PATH;
                videoEl.load();

                // loadeddata待機
                if (videoEl.readyState < 2) {
                    await new Promise(resolve => {
                        videoEl.addEventListener('loadeddata', resolve, { once: true });
                        setTimeout(resolve, 3000);
                    });
                }
            }

            try {
                videoEl.currentTime = 0;
                await videoEl.play();
                hasPlayed = true;
                console.log('✅ Video playing');
            } catch (err) {
                console.log('❌ Play failed:', err.message);
            }
        }

        // 終了時処理
        function onEnded() {
            try {
                videoEl.pause();
                const d = videoEl.duration || 0;
                videoEl.currentTime = Math.max(0, d - 0.06);
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // === 起動時の処理 ===

        // 1. 即座に動画ソース設定（バックグラウンドで読み込み開始）
        videoEl.src = VIDEO_PATH;
        videoEl.load();

        // 2. DOMContentLoaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(playVideo, 100);
            });
        } else {
            setTimeout(playVideo, 100);
        }

        // 3. load（完全読み込み後）
        window.addEventListener('load', () => {
            setTimeout(playVideo, 200);
        });

        // 4. 複数タイミングで自動リトライ
        setTimeout(playVideo, 500);
        setTimeout(playVideo, 1000);
        setTimeout(playVideo, 1500);
        setTimeout(playVideo, 2000);

        // 5. pageshow（PWA復帰・履歴戻り）
        window.addEventListener('pageshow', () => {
            hasPlayed = false;
            setTimeout(playVideo, 100);
            setTimeout(playVideo, 500);
        });

        // 6. visibilitychange（フォアグラウンド復帰）
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !hasPlayed) {
                setTimeout(playVideo, 100);
                setTimeout(playVideo, 500);
            }
        });

        // 7. focus（ウィンドウフォーカス取得時）
        window.addEventListener('focus', () => {
            if (!hasPlayed) {
                setTimeout(playVideo, 100);
            }
        });

        // 8. touchstart（最初のタッチで確実に）
        let touchHandled = false;
        document.addEventListener('touchstart', () => {
            if (!touchHandled) {
                touchHandled = true;
                playVideo();
            }
        }, { once: true, passive: true });

        // 9. click（タップの保険）
        document.addEventListener('click', () => {
            playVideo();
        }, { once: true });
    </script>
</body>

</html>
