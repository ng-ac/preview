<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #fff;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        /* 背景画像 */
        .bg-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .bg-image.show {
            opacity: 1;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* スタート画面 */
        .start-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        .start-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .start-text {
            font-size: 48px;
            font-weight: 700;
            color: #000;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.1em;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <!-- スタート画面 -->
    <div id="startScreen" class="start-screen">
        <div class="start-text">Unlimited</div>
    </div>

    <!-- 背景画像 -->
    <img id="bgImage" class="bg-image" src="/preview/main/main.jpeg" alt="background" />

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        const bgImage = document.getElementById('bgImage');
        const startScreen = document.getElementById('startScreen');

        // 2秒後に画像表示
        function showBackground() {
            setTimeout(() => {
                bgImage.classList.add('show');
                startScreen.classList.add('hide');
            }, 2000);
        }

        // 初期化
        showBackground();
    </script>
</body>

</html>
