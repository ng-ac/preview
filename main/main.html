<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* PWA起動時の透明タップエリア（iOS対策） */
        .tap-to-start {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .tap-to-start.show {
            opacity: 1;
        }

        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            border-radius: 5px;
            max-width: 90%;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="debugInfo" class="debug-info"></div>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- PWA起動時の透明タップエリア -->
    <div id="tapToStart" class="tap-to-start"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let debugEl = document.getElementById('debugInfo');
        let hasPlayed = false;
        let attemptCount = 0;

        // デバッグ表示更新
        function updateDebug(msg) {
            const timestamp = new Date().toLocaleTimeString();
            debugEl.innerHTML = `[${timestamp}] ${msg}<br>` + debugEl.innerHTML;
            // 5秒後に自動で非表示
            setTimeout(() => {
                debugEl.style.opacity = '0.3';
            }, 5000);
        }

        updateDebug('🚀 Script loaded');

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.defaultMuted = true;
            v.volume = 0;
        }

        // シンプルな再生関数
        async function playVideo() {
            if (hasPlayed) {
                updateDebug('⏭️ Already played, skipping');
                return;
            }

            attemptCount++;
            updateDebug(`🎬 Play attempt #${attemptCount}`);

            setVideoFlags(videoEl);

            // srcが未設定なら設定
            if (!videoEl.src || videoEl.src === '') {
                updateDebug('📥 Setting video source');
                videoEl.src = VIDEO_PATH;
                videoEl.load();

                // loadeddata待機
                if (videoEl.readyState < 2) {
                    updateDebug('⏳ Waiting for video data...');
                    await new Promise(resolve => {
                        videoEl.addEventListener('loadeddata', () => {
                            updateDebug('✓ Video data loaded');
                            resolve();
                        }, { once: true });
                        setTimeout(() => {
                            updateDebug('⚠️ Load timeout');
                            resolve();
                        }, 3000);
                    });
                } else {
                    updateDebug('✓ Video already loaded');
                }
            }

            try {
                videoEl.currentTime = 0;
                updateDebug('▶️ Calling play()...');
                await videoEl.play();
                hasPlayed = true;
                updateDebug('✅ VIDEO PLAYING SUCCESS!');

                // 成功したら3秒後にデバッグ非表示
                setTimeout(() => {
                    debugEl.style.display = 'none';
                }, 3000);
            } catch (err) {
                updateDebug(`❌ Play failed: ${err.name}`);
            }
        }

        // 終了時処理
        function onEnded() {
            updateDebug('🏁 Video ended');
            try {
                videoEl.pause();
                const d = videoEl.duration || 0;
                videoEl.currentTime = Math.max(0, d - 0.06);
                updateDebug('⏸️ Paused at last frame');
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // === 起動時の処理 ===

        updateDebug('🔧 Setting up video source');
        videoEl.src = VIDEO_PATH;
        videoEl.load();

        // 2. DOMContentLoaded
        if (document.readyState === 'loading') {
            updateDebug('⏳ Waiting for DOM...');
            document.addEventListener('DOMContentLoaded', () => {
                updateDebug('✓ DOM ready');
                setTimeout(playVideo, 100);
            });
        } else {
            updateDebug('✓ DOM already ready');
            setTimeout(playVideo, 100);
        }

        // 3. load
        window.addEventListener('load', () => {
            updateDebug('✓ Window loaded');
            setTimeout(playVideo, 200);
        });

        // 4. 複数タイミングで自動リトライ
        setTimeout(() => { updateDebug('🔄 Auto-retry 500ms'); playVideo(); }, 500);
        setTimeout(() => { updateDebug('🔄 Auto-retry 1s'); playVideo(); }, 1000);
        setTimeout(() => { updateDebug('🔄 Auto-retry 1.5s'); playVideo(); }, 1500);
        setTimeout(() => { updateDebug('🔄 Auto-retry 2s'); playVideo(); }, 2000);

        // 5. pageshow
        window.addEventListener('pageshow', () => {
            updateDebug('📄 pageshow event');
            hasPlayed = false;
            attemptCount = 0;
            setTimeout(playVideo, 100);
            setTimeout(playVideo, 500);
        });

        // 6. visibilitychange
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !hasPlayed) {
                updateDebug('👁️ Became visible');
                setTimeout(playVideo, 100);
                setTimeout(playVideo, 500);
            }
        });

        // 7. focus
        window.addEventListener('focus', () => {
            if (!hasPlayed) {
                updateDebug('🎯 Window focused');
                setTimeout(playVideo, 100);
            }
        });

        // 8. touchstart
        let touchHandled = false;
        document.addEventListener('touchstart', () => {
            if (!touchHandled) {
                touchHandled = true;
                updateDebug('👆 Touch detected');
                playVideo();
            }
        }, { once: true, passive: true });

        // 9. click
        document.addEventListener('click', () => {
            updateDebug('🖱️ Click detected');
            playVideo();
        }, { once: true });

        updateDebug('✓ All listeners registered');
    </script>
</body>

</html>
