<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0 maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">  <!-- ← black-translucentからblackに変更 -->
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 背景画像 */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .bg-image.show {
            opacity: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 5;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0);
            border-radius: 20px;
        }

        /* セルフよもぎ蒸し（左上） */
        .btn-yomogi {
            top: 30%;
            left: 10%;
            width: 38%;
            height: 28%;
        }

        /* プライベートジム（右上） */
        .btn-gym {
            top: 30%;
            right: 11%;
            width: 38%;
            height: 28%;
        }

        /* SELF TANNING（左下） */
        .btn-tanning {
            top: 63%;
            left: 10%;
            width: 38%;
            height: 28%;
        }

        /* スタート画面 */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        .start-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .start-logo {
            max-width: 300px;
            width: 80%;
            height: auto;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ローディングスピナー */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- スタート画面 -->
    <div id="startScreen" class="start-screen">
        <img src="/preview/main/road.jpg" alt="Unlimited" class="start-logo">
        <div class="loading-spinner"></div>
    </div>

    <!-- 背景画像 -->
    <img id="bgImage" class="bg-image" src="/preview/main/main.jpeg" alt="background" />

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        const bgImage = document.getElementById('bgImage');
        const startScreen = document.getElementById('startScreen');

        // ローディング画面の表示～終了
        function runStartup() {
            setTimeout(() => {
                bgImage.classList.add('show');
                startScreen.classList.add('hide');
            }, 2000);
        }

        window.addEventListener('load', () => {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            runStartup();
        });

        window.addEventListener('pageshow', () => {
            runStartup();
        });
    </script>
</body>

</html>
