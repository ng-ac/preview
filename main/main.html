<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* PWA起動時の透明タップエリア（iOS対策） */
        .tap-to-start {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .tap-to-start.show {
            opacity: 1;
        }

        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            border-radius: 5px;
            max-width: 90%;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="debugInfo" class="debug-info"></div>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- PWA起動時の透明タップエリア -->
    <div id="tapToStart" class="tap-to-start"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';
        let debugEl = document.getElementById('debugInfo');
        let videoEl = document.getElementById('bgVideo');
        let isPlaying = false;

        function updateDebug(msg) {
            const timestamp = new Date().toLocaleTimeString();
            debugEl.innerHTML = `[${timestamp}] ${msg}<br>` + debugEl.innerHTML;
        }

        updateDebug('🚀 Script start');

        // video要素を完全に作り直す（iOS PWA対策）
        function recreateVideoElement() {
            updateDebug('🔄 Recreating video element');

            const parent = videoEl.parentNode;
            const newVideo = document.createElement('video');

            // 属性コピー
            newVideo.id = 'bgVideo';
            newVideo.className = 'bg-video';
            newVideo.muted = true;
            newVideo.playsInline = true;
            newVideo.autoplay = true;
            newVideo.preload = 'auto';
            newVideo.defaultMuted = true;
            newVideo.volume = 0;

            newVideo.setAttribute('muted', '');
            newVideo.setAttribute('playsinline', '');
            newVideo.setAttribute('webkit-playsinline', '');
            newVideo.setAttribute('disablepictureinpicture', '');
            newVideo.setAttribute('disableRemotePlayback', '');
            newVideo.setAttribute('x-webkit-airplay', 'deny');

            // イベントリスナー設定
            newVideo.addEventListener('loadedmetadata', () => {
                updateDebug(`📊 ${newVideo.videoWidth}x${newVideo.videoHeight}, ${newVideo.duration}s`);
            });

            newVideo.addEventListener('playing', () => {
                updateDebug('▶️ PLAYING');
            });

            newVideo.addEventListener('timeupdate', function onTime() {
                if (newVideo.currentTime > 0.1) {
                    updateDebug(`✅ ACTUALLY MOVING! (${newVideo.currentTime.toFixed(2)}s)`);
                    newVideo.removeEventListener('timeupdate', onTime);
                    setTimeout(() => { debugEl.style.display = 'none'; }, 3000);
                }
            });

            newVideo.addEventListener('ended', () => {
                updateDebug('🏁 Ended');
                try {
                    newVideo.pause();
                    const d = newVideo.duration || 0;
                    newVideo.currentTime = Math.max(0, d - 0.06);
                } catch { }
            });

            newVideo.addEventListener('error', () => {
                const err = newVideo.error;
                if (err) updateDebug(`💥 ERROR: ${err.code}`);
            });

            // 要素を置き換え
            parent.replaceChild(newVideo, videoEl);
            videoEl = newVideo;

            updateDebug('✓ Video element recreated');
            return newVideo;
        }

        async function playVideo() {
            if (isPlaying) return;

            updateDebug('🎬 Play attempt');

            // 要素を新しく作り直す
            const video = recreateVideoElement();

            // キャッシュバスター付きでソース設定
            const cacheBuster = '?v=' + Date.now();
            video.src = VIDEO_PATH + cacheBuster;

            updateDebug('📥 Loading...');
            video.load();

            // loadeddata待ち
            await new Promise(resolve => {
                if (video.readyState >= 2) {
                    resolve();
                } else {
                    video.addEventListener('loadeddata', resolve, { once: true });
                    setTimeout(resolve, 5000);
                }
            });

            updateDebug(`✓ Loaded (ready: ${video.readyState})`);

            // 再生
            try {
                video.currentTime = 0;
                await video.play();
                isPlaying = true;
                updateDebug('✅ play() called');

                // 1秒後確認
                setTimeout(() => {
                    updateDebug(`🔍 time=${video.currentTime.toFixed(3)}s, paused=${video.paused}`);

                    if (video.currentTime < 0.05) {
                        updateDebug('⚠️ Still at 0! Retrying...');
                        isPlaying = false;

                        // もう一度だけ試す
                        setTimeout(() => {
                            video.currentTime = 0;
                            video.play().then(() => {
                                updateDebug('🔄 Retry play() done');
                            }).catch(e => {
                                updateDebug(`❌ Retry failed: ${e.name}`);
                            });
                        }, 100);
                    }
                }, 1000);

            } catch (err) {
                updateDebug(`❌ ${err.name}`);
                isPlaying = false;
            }
        }

        // 初期化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                updateDebug('✓ DOM ready');
                setTimeout(playVideo, 200);
            });
        } else {
            updateDebug('✓ DOM already ready');
            setTimeout(playVideo, 200);
        }

        window.addEventListener('load', () => {
            updateDebug('✓ Window loaded');
            if (!isPlaying) setTimeout(playVideo, 300);
        });

        // PWA復帰時
        window.addEventListener('pageshow', (e) => {
            updateDebug('📄 pageshow');
            isPlaying = false;
            setTimeout(playVideo, 200);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !isPlaying) {
                updateDebug('👁️ Visible');
                setTimeout(playVideo, 200);
            }
        });

        // タッチ保険
        let touched = false;
        document.addEventListener('touchstart', () => {
            if (!touched) {
                touched = true;
                updateDebug('👆 Touch');
                isPlaying = false;
                setTimeout(playVideo, 50);
            }
        }, { once: true, passive: true });

        updateDebug('✓ Setup done');
    </script>
</body>

</html>
