<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>umlimited</title>

    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        }

        body {
            height:100vh;
            height: 100dvh;      /* iOS16+ / 近年のブラウザ */
            height: 100svh;      /* iOS15.4+ 対応（必要なら） */
            height: -webkit-fill-available; /* 古いiOSの保険 */
            width: 100vw;
            overflow:hidden;
            background-image: url('/preview/main/main.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
            padding: 0;
        }

        /* 左側のメニュー */
        .menu {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            gap: 35px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            height: 100%;
            max-height: none;
            overflow-y: auto;
        }

        html {
        background-color: #000;
        height: -webkit-fill-available;
        }

        .menu a {
            height: 100%;
            max-height: none;
            overflow-y: auto;
            box-sizing: border-box;
            color: #333;
            font-size: 26px;
            text-decoration: none;
            font-weight: 900;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            padding-bottom: 6px;
        }


        @media (max-width: 600px) {
            .menu {
                padding: 30px 25px;
                gap: 25px;
            }

            .menu a {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <nav class="menu">
        <a href="/preview/yomogi/yomogi.html">ーよもぎ蒸し</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
        <a href="#">ーcomming soon...</a>
    </nav>

    <script>
        // Service Worker 登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/preview/service-worker.js')
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
