<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA関連 -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            background: #000;
        }

        /* 背景動画 */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }

        /* 再生失敗時のタップ用ボタン（最小UI） */
        .tap-to-play {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 10;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            -webkit-tap-highlight-color: transparent;
        }

        .tap-to-play button {
            font: 600 16px/1 'Poppins', 'Noto Sans JP', sans-serif;
            padding: 14px 20px;
            border-radius: 9999px;
            border: none;
            background: #ffffff;
            color: #111;
            letter-spacing: .02em;
        }

        /* 透明リンク（ボタン位置は main.css 側で調整想定） */
        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- 背景動画（1回だけ再生。ただし再入場時は都度再生を試行） -->
    <video class="bg-video" id="bgVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture
        disableRemotePlayback>
        <source src="/preview/main/main.mp4" type="video/mp4">
    </video>

    <!-- 透明リンク（各ボタン位置に対応） -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- 再生できない場合のフォールバックUI -->
    <div class="tap-to-play" id="tapToPlay">
        <button type="button" id="tapToPlayBtn">タップして再生</button>
    </div>

    <script>
        // ===============================
        // 背景動画の安定再生ロジック（PWA/ホーム画面対策込み）
        // ===============================
        const v = document.getElementById('bgVideo');
        const tap = document.getElementById('tapToPlay');
        const tapBtn = document.getElementById('tapToPlayBtn');

        let playLock = false;     // 多重 play() 防止
        let lastPlayAt = 0;       // 短時間多発抑制
        let retryCount = 0;

        // 端末依存の属性を常時付与（iOSはロード前にmuted/playsinlineが必要）
        function setVideoProps() {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true; // 意図：自動再生
            v.defaultMuted = true;
            v.volume = 0;
        }

        // 失敗時に表示するタップUI
        function showTap() { tap.style.display = 'flex'; }
        function hideTap() { tap.style.display = 'none'; }

        // 動画をクリーンに再ロード（クエリは付けない：SW側で正規化）
        async function reloadVideoSource() {
            const srcEl = v.querySelector('source');
            const base = '/preview/main/main.mp4';
            if (!srcEl || srcEl.src.replace(location.origin, '') !== base) {
                if (srcEl) srcEl.src = base;
            }
            v.load();
            // 2秒タイムアウトで loadeddata を待つ
            await Promise.race([
                new Promise(res => v.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
        }

        async function tryPlayOnce() {
            setVideoProps();
            await reloadVideoSource();
            try {
                await v.play();
                retryCount = 0;
                hideTap();
                // iOS PWAでまれに currentTime が末尾に飛ぶ現象対策
                if (!isFinite(v.currentTime) || v.currentTime > 0.1) {
                    try { v.currentTime = 0; } catch (_) { }
                }
                console.log('✓ video playing');
                return true;
            } catch (err) {
                console.log('play failed:', err && err.name || err);
                return false;
            }
        }

        async function forcePlay() {
            const now = Date.now();
            if (playLock || (now - lastPlayAt) < 400) return; // 400ms以内の連打抑制
            playLock = true; lastPlayAt = now;

            let ok = await tryPlayOnce();
            // 自動再生が弾かれた場合は指数バックオフで数回リトライ
            while (!ok && retryCount < 3) {
                retryCount++;
                await new Promise(r => setTimeout(r, 300 * retryCount));
                ok = await tryPlayOnce();
            }
            if (!ok) showTap();

            playLock = false;
        }

        v.addEventListener('ended', () => {
            try { v.pause(); v.currentTime = Math.max(0, v.duration || 0); } catch (_) { }
        });

        tapBtn.addEventListener('click', () => { hideTap(); forcePlay(); }, { passive: true });
        document.addEventListener('touchstart', () => { hideTap(); forcePlay(); }, { once: true, passive: true });

        window.addEventListener('load', forcePlay);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) setTimeout(forcePlay, 100);
        });
        window.addEventListener('pageshow', () => { forcePlay(); });
        window.addEventListener('focus', () => { forcePlay(); });

        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('/preview/service-worker.js', { scope: '/preview/' })
                .then(reg => {
                    console.log('SW registered', reg.scope);
                })
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>

</html>
