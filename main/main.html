<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA関連 -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            background: #000;
        }

        /* 背景動画 */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            background: #000;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
        }

        /* 透明リンク（ボタン位置は main.css 側で調整想定） */
        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* 再生失敗時のタップUI */
        .tap-to-play {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 10;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            -webkit-tap-highlight-color: transparent;
        }

        .tap-to-play button {
            font: 600 16px/1 'Poppins', 'Noto Sans JP', sans-serif;
            padding: 14px 20px;
            border-radius: 9999px;
            border: none;
            background: #ffffff;
            color: #111;
            letter-spacing: .02em;
        }
    </style>
</head>

<body>
    <!-- 背景動画（srcはJSで毎回Blob URLに差し替える） -->
    <video class="bg-video" id="bgVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture
        disableRemotePlayback></video>

    <!-- 透明リンク -->
    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- 再生できない場合のフォールバックUI -->
    <div class="tap-to-play" id="tapToPlay">
        <button type="button" id="tapToPlayBtn">タップして再生</button>
    </div>

    <script>
        // ===============================
        // 背景動画：2回目以降の起動でも必ず再生させる
        // アプローチ：毎回 fetch → Blob → objectURL を video.src に適用
        // これにより URL が毎回ユニークになり、デコーダが確実に再初期化される
        // SW はそのままでOK（キャッシュから即時返る）
        // ===============================
        const BASE_VIDEO_PATH = '/preview/main/main.mp4';
        const v = document.getElementById('bgVideo');
        const tap = document.getElementById('tapToPlay');
        const tapBtn = document.getElementById('tapToPlayBtn');

        let playLock = false;   // 多重 play() 防止
        let lastPlayAt = 0;     // 短時間呼び出し抑制
        let currentBlobUrl = null;

        function setVideoProps() {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
            v.removeAttribute('poster');
        }

        function revokeBlobUrl() {
            if (currentBlobUrl) {
                try { URL.revokeObjectURL(currentBlobUrl); } catch (_) { }
                currentBlobUrl = null;
            }
        }

        async function buildBlobUrl() {
            // SW が mp4 をキャッシュ済みなら、ここでの fetch はキャッシュヒット（即応答）
            // Range 要求は使わず全体取得でOK（objectURL再生は先頭からで十分）
            const resp = await fetch(BASE_VIDEO_PATH, { method: 'GET' });
            if (!resp.ok) throw new Error('video fetch failed: ' + resp.status);
            const blob = await resp.blob();
            return URL.createObjectURL(blob);
        }

        async function loadFromBlob() {
            revokeBlobUrl();
            const url = await buildBlobUrl();
            currentBlobUrl = url;

            // iOSでの復元バグ回避：一旦srcをクリアしてから新URLを適用
            try { v.pause(); } catch (_) { }
            v.removeAttribute('src');
            v.src = url;
            v.load();

            // loadeddata を待つ（2秒タイムアウト）
            await Promise.race([
                new Promise(res => v.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
        }

        async function tryPlayOnce({ hardReload = false } = {}) {
            setVideoProps();

            if (hardReload || !currentBlobUrl) {
                await loadFromBlob();
            }

            try {
                // 先頭から再生
                try { if (!Number.isFinite(v.currentTime) || v.currentTime > 0.1) v.currentTime = 0; } catch (_) { }
                await v.play();
                hideTap();
                return true;
            } catch (err) {
                return false;
            }
        }

        async function forcePlay() {
            const now = Date.now();
            if (playLock || (now - lastPlayAt) < 400) return;
            playLock = true; lastPlayAt = now;

            // 1) 既存BlobURLで再生
            let ok = await tryPlayOnce({ hardReload: false });

            // 2) ダメなら BlobURL を作り直し（強制再初期化）
            if (!ok) {
                ok = await tryPlayOnce({ hardReload: true });
            }

            // 3) それでもダメならタップ誘導
            if (!ok) showTap();

            playLock = false;
        }

        // 終了時は「最後のフレームで静止」
        v.addEventListener('ended', async () => {
            try {
                v.pause();
                const d = Number.isFinite(v.duration) ? v.duration : 0;
                const target = Math.max(0, d - 0.06); // 60ms手前
                v.currentTime = target;
                try {
                    const p = v.play();
                    if (p && typeof p.then === 'function') { await p.catch(() => { }); }
                } catch (_) { }
                v.pause();
            } catch (_) { }
        });

        // 再生できない場合のフォールバックUI
        function showTap() { tap.style.display = 'flex'; }
        function hideTap() { tap.style.display = 'none'; }

        tapBtn.addEventListener('click', () => { hideTap(); forcePlay(); }, { passive: true });
        document.addEventListener('touchstart', () => { hideTap(); forcePlay(); }, { once: true, passive: true });

        // 初回（Web/ホーム画面起動とも）
        window.addEventListener('load', forcePlay);

        // アプリ復帰・再表示時（PWAの2回目以降の起動含む）
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) setTimeout(forcePlay, 80);
        });
        window.addEventListener('pageshow', () => { setTimeout(forcePlay, 80); });
        window.addEventListener('focus', () => { setTimeout(forcePlay, 80); });

        // ページ遷移や再読込時に Blob URL を破棄（メモリリーク防止）
        window.addEventListener('beforeunload', revokeBlobUrl);

        // Service Worker 登録（v5想定）
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('/preview/service-worker.js', { scope: '/preview/' })
                .then(reg => { console.log('SW registered', reg.scope); })
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>

</html>
