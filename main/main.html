<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* タップ促進（PWA初回起動時のみ表示） */
        .tap-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: none;
            pointer-events: auto;
        }

        .tap-overlay.show {
            display: block;
        }
    </style>
</head>

<body>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- 透明タップエリア（PWA初回起動時） -->
    <div id="tapOverlay" class="tap-overlay"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let tapOverlay = document.getElementById('tapOverlay');
        let blobUrl = null;
        let hasInteracted = false;

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.defaultMuted = true;
            v.volume = 0;
            v.removeAttribute('poster');
        }

        function revokeBlob() {
            if (blobUrl) {
                try { URL.revokeObjectURL(blobUrl); } catch { }
                blobUrl = null;
            }
        }

        async function fetchVideoResponse() {
            try {
                if ('caches' in window) {
                    const cached = await caches.match(VIDEO_PATH, { ignoreSearch: true });
                    if (cached) return cached;
                }
            } catch { }
            const resp = await fetch(VIDEO_PATH, { method: 'GET' });
            if (!resp.ok) throw new Error('video fetch failed: ' + resp.status);
            try {
                if ('caches' in window) {
                    const c = await caches.open('video-cache-simple');
                    await c.put(VIDEO_PATH, resp.clone());
                }
            } catch { }
            return resp;
        }

        async function prepareBlobSource() {
            revokeBlob();
            const resp = await fetchVideoResponse();
            const blob = await resp.blob();
            blobUrl = URL.createObjectURL(blob);

            try { videoEl.pause(); } catch { }
            videoEl.removeAttribute('src');
            videoEl.src = blobUrl;
            videoEl.load();

            await Promise.race([
                new Promise(res => videoEl.addEventListener('loadeddata', res, { once: true })),
                new Promise(res => setTimeout(res, 2000))
            ]);
        }

        async function playVideo() {
            setVideoFlags(videoEl);
            await prepareBlobSource();

            try { videoEl.currentTime = 0; } catch { }

            try {
                await videoEl.play();
                return true;
            } catch (err) {
                return false;
            }
        }

        async function onEnded() {
            try {
                videoEl.pause();
                const d = Number.isFinite(videoEl.duration) ? videoEl.duration : 0;
                const t = Math.max(0, d - 0.06);
                videoEl.currentTime = t;
                try {
                    const p = videoEl.play();
                    if (p && typeof p.then === 'function') await p.catch(() => { });
                } catch { }
                videoEl.pause();
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // ユーザーインタラクション処理
        async function handleInteraction() {
            if (hasInteracted) return;
            hasInteracted = true;

            // タップオーバーレイを非表示
            tapOverlay.classList.remove('show');

            // 動画再生
            await playVideo();

            // イベントリスナー削除
            tapOverlay.removeEventListener('touchstart', handleInteraction);
            tapOverlay.removeEventListener('click', handleInteraction);
        }

        tapOverlay.addEventListener('touchstart', handleInteraction, { passive: true });
        tapOverlay.addEventListener('click', handleInteraction);

        // 初期化
        async function init() {
            // まず自動再生を試す
            const success = await playVideo();

            if (!success) {
                // 自動再生失敗 → タップオーバーレイ表示
                tapOverlay.classList.add('show');
            }
        }

        window.addEventListener('DOMContentLoaded', init);

        // PWA復帰時（2回目以降は自動再生される）
        window.addEventListener('pageshow', (e) => {
            if (hasInteracted) {
                // 既にインタラクション済みなら自動再生
                playVideo();
            } else {
                // 未インタラクションなら初期化
                init();
            }
        });

        window.addEventListener('pagehide', revokeBlob);
        window.addEventListener('beforeunload', revokeBlob);
    </script>
</body>

</html>
