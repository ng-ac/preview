<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* PWA起動時の透明タップエリア（iOS対策） */
        .tap-to-start {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .tap-to-start.show {
            opacity: 1;
        }

        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            border-radius: 5px;
            max-width: 90%;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="debugInfo" class="debug-info"></div>
    <video id="bgVideo" class="bg-video" autoplay muted playsinline webkit-playsinline preload="auto"
        disablepictureinpicture disableRemotePlayback x-webkit-airplay="deny"></video>

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <!-- PWA起動時の透明タップエリア -->
    <div id="tapToStart" class="tap-to-start"></div>

    <script>
        const VIDEO_PATH = '/preview/main/main.mp4';

        let videoEl = document.getElementById('bgVideo');
        let debugEl = document.getElementById('debugInfo');
        let hasPlayStarted = false;
        let attemptCount = 0;

        function updateDebug(msg) {
            const timestamp = new Date().toLocaleTimeString();
            debugEl.innerHTML = `[${timestamp}] ${msg}<br>` + debugEl.innerHTML;
            setTimeout(() => { debugEl.style.opacity = '0.3'; }, 5000);
        }

        updateDebug('🚀 Script loaded');

        function setVideoFlags(v) {
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.defaultMuted = true;
            v.volume = 0;
        }

        // 動画の状態を監視
        videoEl.addEventListener('playing', () => {
            updateDebug('▶️ PLAYING event fired');
            setTimeout(() => { debugEl.style.display = 'none'; }, 3000);
        });

        videoEl.addEventListener('pause', () => {
            updateDebug('⏸️ PAUSED (unexpected!)');
        });

        videoEl.addEventListener('stalled', () => {
            updateDebug('⚠️ STALLED - buffering issue?');
        });

        videoEl.addEventListener('error', (e) => {
            updateDebug(`💥 ERROR: ${videoEl.error ? videoEl.error.code : 'unknown'}`);
        });

        videoEl.addEventListener('timeupdate', function onTimeUpdate() {
            if (videoEl.currentTime > 0.5) {
                updateDebug('✅ Video actually playing! (time > 0.5s)');
                videoEl.removeEventListener('timeupdate', onTimeUpdate);
            }
        });

        async function playVideo() {
            if (hasPlayStarted) return;

            attemptCount++;
            updateDebug(`🎬 Attempt #${attemptCount}`);

            setVideoFlags(videoEl);

            if (!videoEl.src || videoEl.src === '') {
                updateDebug('📥 Setting source');
                videoEl.src = VIDEO_PATH;
                videoEl.load();

                if (videoEl.readyState < 2) {
                    updateDebug('⏳ Loading...');
                    await new Promise(resolve => {
                        videoEl.addEventListener('loadeddata', resolve, { once: true });
                        setTimeout(resolve, 3000);
                    });
                    updateDebug(`✓ Loaded (readyState: ${videoEl.readyState})`);
                }
            }

            try {
                videoEl.currentTime = 0;
                await videoEl.play();
                hasPlayStarted = true;
                updateDebug(`✅ play() resolved (paused: ${videoEl.paused})`);

                // 0.5秒後に実際に再生されているか確認
                setTimeout(() => {
                    if (videoEl.paused) {
                        updateDebug('⚠️ Video is PAUSED after play()!');
                        hasPlayStarted = false;
                        // 再度試行
                        videoEl.play().catch(e => updateDebug(`❌ Retry failed: ${e.name}`));
                    } else {
                        updateDebug(`✓ Still playing (time: ${videoEl.currentTime.toFixed(2)}s)`);
                    }
                }, 500);

            } catch (err) {
                updateDebug(`❌ ${err.name}: ${err.message}`);
            }
        }

        function onEnded() {
            updateDebug('🏁 Video ended');
            try {
                videoEl.pause();
                const d = videoEl.duration || 0;
                videoEl.currentTime = Math.max(0, d - 0.06);
            } catch { }
        }

        videoEl.addEventListener('ended', onEnded);

        // 初期設定
        updateDebug('🔧 Setting source');
        videoEl.src = VIDEO_PATH;
        videoEl.load();

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                updateDebug('✓ DOM ready');
                setTimeout(playVideo, 100);
            });
        } else {
            updateDebug('✓ DOM already ready');
            setTimeout(playVideo, 100);
        }

        window.addEventListener('load', () => {
            updateDebug('✓ Window loaded');
            setTimeout(playVideo, 200);
        });

        setTimeout(() => playVideo(), 500);
        setTimeout(() => playVideo(), 1000);
        setTimeout(() => playVideo(), 1500);

        window.addEventListener('pageshow', () => {
            updateDebug('📄 pageshow');
            hasPlayStarted = false;
            setTimeout(playVideo, 100);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !hasPlayStarted) {
                updateDebug('👁️ Visible');
                setTimeout(playVideo, 100);
            }
        });

        window.addEventListener('focus', () => {
            if (!hasPlayStarted) {
                updateDebug('🎯 Focused');
                setTimeout(playVideo, 100);
            }
        });

        let touchHandled = false;
        document.addEventListener('touchstart', () => {
            if (!touchHandled) {
                touchHandled = true;
                updateDebug('👆 Touch');
                playVideo();
            }
        }, { once: true, passive: true });

        updateDebug('✓ Listeners ready');
    </script>
</body>

</html>
