<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umlimited</title>

    <!-- PWA -->
    <link rel="manifest" href="/preview/main/manifest.json">
    <link rel="icon" href="/preview/main/unlimited.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/preview/main/unlimited.ico">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="umlimited">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/preview/main/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #fff;
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .bg-video.hide {
            opacity: 0;
        }

        .bg-video::-webkit-media-controls {
            display: none !important;
        }

        /* 静止画背景 */
        .bg-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bg-image.show {
            opacity: 1;
        }

        .overlay {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* スタート画面 */
        .start-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .start-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .start-button {
            background: #000;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .start-button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <!-- スタート画面 -->
    <div id="startScreen" class="start-screen">
        <button id="startButton" class="start-button">Start</button>
    </div>

    <!-- 動画背景 -->
    <video id="bgVideo" class="bg-video" src="/preview/main/main.mp4" muted playsinline webkit-playsinline
        preload="auto"></video>

    <!-- 静止画背景（動画再生後・戻った時） -->
    <img id="bgImage" class="bg-image" src="/preview/main/end.jpeg" alt="background" />

    <div class="overlay">
        <a href="/preview/yomogi/yomogi.html" class="btn-yomogi" aria-label="セルフよもぎ蒸し"></a>
        <a href="/preview/gym/gym.html" class="btn-gym" aria-label="プライベートジム"></a>
        <a href="/preview/tanning/tanning.html" class="btn-tanning" aria-label="SELF TANNING"></a>
    </div>

    <script>
        const videoEl = document.getElementById('bgVideo');
        const bgImage = document.getElementById('bgImage');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');

        const SESSION_KEY = 'main_video_played';

        videoEl.muted = true;
        videoEl.volume = 0;
        videoEl.defaultMuted = true;

        // セッション内で再生済みか
        function hasPlayedInSession() {
            return sessionStorage.getItem(SESSION_KEY) === 'true';
        }

        // 再生済みフラグ保存
        function markAsPlayed() {
            sessionStorage.setItem(SESSION_KEY, 'true');
        }

        // 静止画を表示
        function showStaticImage() {
            videoEl.classList.add('hide');
            videoEl.pause();
            bgImage.classList.add('show');
        }

        // 動画を表示
        function showVideo() {
            videoEl.classList.remove('hide');
            bgImage.classList.remove('show');
        }

        // スタート画面を非表示
        function hideStartScreen() {
            startScreen.classList.add('hide');
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 500);
        }

        // スタート画面を表示
        function showStartScreen() {
            startScreen.style.display = 'flex';
            startScreen.classList.remove('hide');
        }

        // Startボタンクリック時
        async function handleStart() {
            try {
                showVideo();
                videoEl.currentTime = 0;
                await videoEl.play();

                // 再生成功
                markAsPlayed();
                hideStartScreen();

            } catch (err) {
                // 再生失敗 → 静止画表示
                showStaticImage();
                hideStartScreen();
                markAsPlayed();
            }
        }

        // イベントリスナー登録
        startButton.addEventListener('click', handleStart);
        startButton.addEventListener('touchstart', handleStart, { passive: true });

        // 動画終了時：静止画に切り替え
        videoEl.addEventListener('ended', () => {
            showStaticImage();
        });

        // 初期化処理
        function init() {
            if (hasPlayedInSession()) {
                // 既に再生済み → スタート画面非表示 + 静止画表示
                startScreen.style.display = 'none';
                showStaticImage();
            } else {
                // 未再生 → スタート画面表示
                showStartScreen();
                // 動画と静止画は非表示
                videoEl.classList.add('hide');
                bgImage.classList.remove('show');
            }
        }

        // ページ表示時（戻る・復帰含む）
        window.addEventListener('pageshow', (event) => {
            init();
        });

        // フォアグラウンド復帰時
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && hasPlayedInSession()) {
                // 再生済みなら静止画表示
                showStaticImage();
            }
        });

        // 初回読み込み時
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>

</html>
