<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メインメニュー</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+JP:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f0;
            font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: 100%;
            opacity: 0.15;
            z-index: 0;
        }

        .menu-container {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .menu-buttons {
            display: flex;
            gap: 160px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .menu-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: none;
            backdrop-filter: blur(10px);
            border: none;
            cursor: pointer;
            font-size: 22px;
            font-weight: 700;
            color: #808080;
            font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
            letter-spacing: 0.05em;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 17px rgba(0, 0, 0, 0.08);
        }

        @media (max-width: 768px) {
            .menu-buttons {
                gap: 40px;
            }

            .menu-btn {
                width: 160px;
                height: 160px;
                font-size: 18px;
            }

            .bg-logo {
                width: 90vmin;
                height: 90vmin;
            }
        }
    </style>
</head>

<body>
    <img src="./photo/アンリミテッド.png" alt="Background" class="bg-logo">

    <div class="menu-container">
        <div class="menu-buttons">
            <button class="menu-btn" onclick="location.href='#'">comming<br>soon...</button>
            <button class="menu-btn" onclick="location.href='yomogi.html'">よもぎ蒸し</button>
            <button class="menu-btn" onclick="location.href='#'">comming<br>soon...</button>
        </div>
    </div>
</body>

</html>
