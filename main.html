<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nav">
    <title>Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .nav-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-card:active {
            transform: scale(0.98);
            background: #f9f9f9;
        }

        .nav-card-content {
            position: relative;
            z-index: 1;
        }

        .nav-title {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }

        .install-prompt.show {
            display: block;
        }

        .install-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
            touch-action: manipulation;
        }

        .close-btn {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 10px;
        }

        @media (min-width: 600px) {
            .container {
                max-width: 600px;
            }

            .nav-grid {
                gap: 25px;
            }

            .nav-card {
                padding: 40px;
                min-height: 120px;
            }

            .nav-title {
                font-size: 2rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .nav-grid {
                flex-direction: row;
            }

            .nav-card {
                flex: 1;
                min-height: 80px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav-grid">
            <a href="mc.html" class="nav-card">
                <div class="nav-card-content">
                    <div class="nav-title">MC</div>
                </div>
            </a>

            <a href="htc.html" class="nav-card">
                <div class="nav-card-content">
                    <div class="nav-title">HTC</div>
                </div>
            </a>

            <a href="masakari.html" class="nav-card">
                <div class="nav-card-content">
                    <div class="nav-title">MASAKARI</div>
                </div>
            </a>
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        <p style="margin-bottom: 10px; font-weight: 500;">ホーム画面に追加してオフラインでも使えます</p>
        <button class="install-btn" id="installBtn">インストール</button>
        <button class="close-btn" id="closeBtn">後で</button>
    </div>

    <script>
        // Service Worker登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('Service Worker registered'))
                .catch((err) => console.log('Service Worker error:', err));
        }

        // インストールプロンプト
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installBtn = document.getElementById('installBtn');
        const closeBtn = document.getElementById('closeBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installPrompt.classList.add('show');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installPrompt.classList.remove('show');
            }
        });

        closeBtn.addEventListener('click', () => {
            installPrompt.classList.remove('show');
        });
    </script>
</body>

</html>
